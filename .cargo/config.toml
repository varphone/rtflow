# Cross-compilation template for embedded IPC targets (HiSilicon HiMPP,
# Ingenic, Novatek, ...). Adjust the linker to your toolchain prefix and
# uncomment the target block you need; build with:
#
#   cargo build --release --features embedded-gateway --target aarch64-unknown-linux-gnu
#
# [target.aarch64-unknown-linux-gnu]
# linker = "aarch64-linux-gnu-gcc"
# rustflags = ["-C", "link-arg=-s"]
#
# [target.armv7-unknown-linux-gnueabihf]
# linker = "arm-linux-gnueabihf-gcc"
# rustflags = ["-C", "link-arg=-s"]
