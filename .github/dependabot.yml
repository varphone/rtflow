version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # The pinned toolchain version is the MSRV gate, not a dependency to
      # bump: raise it only together with [workspace.package] rust-version.
      - dependency-name: "dtolnay/rust-toolchain"
