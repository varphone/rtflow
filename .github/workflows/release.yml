name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only run cargo publish --dry-run"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify gates
        run: ./scripts/release-check.sh
      - name: Publish dry-run (workspace, topological order)
        run: cargo publish --workspace --dry-run --allow-dirty --registry crates-io
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true && env.CARGO_REGISTRY_TOKEN != ''
        # `cargo publish --workspace` orders the crates by dependency.
        run: cargo publish --workspace --allow-dirty --registry crates-io
