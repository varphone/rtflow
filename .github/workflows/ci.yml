name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --no-default-features --lib

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo generate-lockfile
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
          arguments: --all-features

  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Layering rules
        run: python3 scripts/check-layering.py --baseline scripts/layering-baseline.json
      - name: Repository tree
        run: python3 scripts/check-tree.py
      - name: Documentation paths
        run: ./scripts/check-docs-paths.sh

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (protocol features)
        run: >-
          cargo clippy --all-targets
          --features "client,server,srtp,multicast,test-source,rtmp,srt,dash,webrtc"
          -- -D warnings
      - name: Tests
        run: cargo test --all-targets --no-fail-fast
      - name: Experimental protocol tests
        run: cargo test --features experimental-protocols --no-fail-fast
      - name: SRTP and multicast tests
        run: cargo test --features "srtp,multicast" --no-fail-fast
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps
      - name: Examples
        run: ./scripts/check-examples.sh

  feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - name: Check no default features (lib only, no dev-deps)
        run: cargo check --no-default-features --lib
      - name: Unit tests without default features
        run: cargo test --no-default-features --lib
      - name: Each feature in isolation (gstreamer needs system libs)
        run: cargo hack check --each-feature --no-dev-deps -p rtflow --skip gstreamer
      - name: Feature pairs (depth 2, gstreamer excluded)
        run: cargo hack check --feature-powerset --depth 2 --no-dev-deps -p rtflow --skip gstreamer
      - name: Embedded profiles
        run: |
          cargo check --no-default-features --features embedded-gateway
          cargo check --no-default-features --features experimental-protocols
          cargo check --no-default-features --features full
          cargo check --no-default-features --features "server,tls,srtp"

  media-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav
      - name: Verify committed fixtures
        working-directory: tests/fixtures
        run: sha256sum -c SHA256SUMS
      - name: GStreamer live interoperability
        run: |
          cargo test --test interop -- --ignored --nocapture gstreamer_interop
          cargo test --test interop -- --ignored --nocapture gstreamer_codec_matrix
          cargo test --test interop -- --ignored --nocapture live_tool_stream
      - name: FFmpeg publish interoperability
        run: cargo test --test interop -- --ignored --nocapture ffmpeg_publish_interop
      - name: Generated file-format interoperability
        run: cargo test --test storage -- --ignored --nocapture file_stream

  semver:
    runs-on: ubuntu-latest
    # Advisory until a 0.3.0 baseline is published; then make it blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  fuzz-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo fuzz build
      - name: Fuzz control framing
        run: cargo fuzz run control_framing -- -max_total_time=60
      - name: Fuzz RTP and RTCP
        run: cargo fuzz run rtp_rtcp -- -max_total_time=60
      - name: Fuzz SRTP/SRTCP
        run: cargo fuzz run srtp -- -max_total_time=60

  soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Session churn and fanout soak
        env:
          RTSP_SOAK_SECONDS: 300
        run: cargo test --test system -- --ignored --nocapture soak

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: List package contents
        run: cargo package --allow-dirty --list
      - name: Build package
        run: cargo package --allow-dirty
