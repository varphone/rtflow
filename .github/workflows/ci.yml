name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  # rustsec/audit-check publishes its result as a check run.
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
      # rtflow-gst is a workspace member and needs the GStreamer dev files.
      - name: Install GStreamer development files
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: cargo check --workspace --no-default-features --lib

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo generate-lockfile
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
          arguments: --all-features

  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Layering rules
        run: python3 scripts/check-layering.py
      - name: Repository tree
        run: python3 scripts/check-tree.py
      - name: Documentation paths
        run: ./scripts/check-docs-paths.sh

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The workspace includes rtflow-gst, whose gstreamer-sys build script
      # needs the system GStreamer/GLib development files.
      - name: Install GStreamer development files
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --no-fail-fast
      - name: All-feature tests
        run: cargo test --workspace --all-features --no-fail-fast
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features
      - name: Examples
        run: ./scripts/check-examples.sh

  feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - name: Check no default features (lib only)
        run: cargo check -p rtflow --no-default-features --lib
      - name: Unit tests without default features
        run: cargo test -p rtflow --no-default-features --lib
      - name: Each feature in isolation (gstreamer needs system libs)
        run: cargo hack check --each-feature --no-dev-deps -p rtflow --skip gstreamer
      - name: Feature pairs (depth 2, gstreamer excluded)
        run: cargo hack check --feature-powerset --depth 2 --no-dev-deps -p rtflow --skip gstreamer
      - name: Embedded profiles
        run: |
          cargo check -p rtflow --no-default-features --features embedded-gateway
          cargo check -p rtflow --no-default-features --features experimental-protocols
          cargo check -p rtflow --no-default-features --features full
          cargo check -p rtflow --no-default-features --features "server,tls,srtp"

  media-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav
      - name: Verify committed fixtures
        working-directory: tests/fixtures
        run: sha256sum -c SHA256SUMS
      - name: GStreamer live interoperability
        run: |
          cargo test -p rtflow --test interop -- --ignored --nocapture gstreamer_interop
          cargo test -p rtflow --test interop -- --ignored --nocapture gstreamer_codec_matrix
          cargo test -p rtflow --test interop -- --ignored --nocapture live_tool_stream
      - name: FFmpeg publish interoperability
        run: cargo test -p rtflow --test interop -- --ignored --nocapture ffmpeg_publish_interop
      - name: FFmpeg new-codec round trips
        run: |
          cargo test -p rtflow --test interop -- --ignored --nocapture ffmpeg_round_trips_legacy_codecs
          cargo test -p rtflow --test interop -- --ignored --nocapture ffmpeg_round_trips_av1
      - name: GStreamer legacy-codec playback
        run: cargo test -p rtflow --test interop -- --ignored --nocapture gstreamer_plays_legacy_codecs
      - name: Generated file-format interoperability
        run: cargo test -p rtflow --test storage -- --ignored --nocapture file_stream

  semver:
    runs-on: ubuntu-latest
    # cargo-semver-checks compares against a crates.io baseline; 0.4.0 is the
    # first release. After publishing, set the repository variable
    # CI_SEMVER_BASELINE=true and drop continue-on-error to make it blocking.
    if: vars.CI_SEMVER_BASELINE == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  fuzz-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo fuzz build
      - name: Fuzz control framing
        run: cargo fuzz run control_framing -- -max_total_time=60
      - name: Fuzz RTP and RTCP
        run: cargo fuzz run rtp_rtcp -- -max_total_time=60
      - name: Fuzz SRTP/SRTCP
        run: cargo fuzz run srtp -- -max_total_time=60

  soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Session churn and fanout soak
        env:
          RTSP_SOAK_SECONDS: 300
        run: cargo test -p rtflow --test system -- --ignored --nocapture soak

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rtflow-gst depends on the system GStreamer libraries, which the
      # package-verification build needs (docs.rs cannot build it either).
      - name: Install GStreamer development files
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      # `publish` values differ across members (true / ["crates-io"] / false),
      # so the registry has to be named explicitly.
      - name: List package contents
        run: cargo package --workspace --allow-dirty --list --registry crates-io
      - name: Build packages
        run: cargo package --workspace --allow-dirty --registry crates-io
