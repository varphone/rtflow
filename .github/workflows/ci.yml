name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --lib

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo generate-lockfile
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Layering rules
        run: python3 scripts/check-layering.py --baseline scripts/layering-baseline.json
      - name: Repository tree
        run: python3 scripts/check-tree.py
      - name: Documentation paths
        run: ./scripts/check-docs-paths.sh

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps
      - name: Examples
        run: |
          cargo build --examples
          ./tools/check-examples.sh

  feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test no default features
        run: cargo test --no-default-features --lib
      - name: Test each feature individually
        run: |
          for feat in srtp tls mp4 mkv client server file-storage metrics multicast; do
            echo "=== Testing feature: $feat ==="
            cargo check --no-default-features --features "$feat"
          done
      - name: Test combined features
        run: cargo check --no-default-features --features "server,tls,srtp"

  media-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav
      - name: Verify committed fixtures
        working-directory: tests/fixtures
        run: sha256sum -c SHA256SUMS
      - name: GStreamer live interoperability
        run: |
          cargo test --test gstreamer_interop -- --ignored --nocapture
          cargo test --test gstreamer_codec_matrix -- --ignored --nocapture
          cargo test --test live_tool_stream -- --ignored --nocapture
      - name: FFmpeg publish interoperability
        run: cargo test --test ffmpeg_publish_interop -- --ignored --nocapture
      - name: Generated file-format interoperability
        run: cargo test --test file_stream -- --ignored --nocapture

  fuzz-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo fuzz build
      - name: Fuzz control framing
        run: cargo fuzz run control_framing -- -max_total_time=60
      - name: Fuzz RTP and RTCP
        run: cargo fuzz run rtp_rtcp -- -max_total_time=60

  soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Session churn and fanout soak
        env:
          RTSP_SOAK_SECONDS: 300
        run: cargo test --test soak -- --ignored --nocapture

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package
