[package]
name = "rtflow-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Encoded media types, bitstream helpers and container-agnostic demuxing for rtflow"
readme = false
publish = true

[features]
default = []
multicast = []
mp4 = ["dep:mp4box"]
mkv = ["dep:matroska-demuxer"]

[dependencies]
rtflow-core.workspace = true
rtflow-multicast.workspace = true
base64.workspace = true
bytes.workspace = true
mp4box = { workspace = true, optional = true }
matroska-demuxer = { workspace = true, optional = true }
