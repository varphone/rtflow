[package]
name = "rtflow-file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Container demuxing and file playback for rtflow (MP4, MKV, MPEG-TS, WAV, raw)"
readme = false
publish = true

[features]
default = []
mp4 = ["dep:mp4box"]
mkv = ["dep:matroska-demuxer"]

[dependencies]
rtflow-core.workspace = true
rtflow-media.workspace = true
rtflow-pipeline.workspace = true
base64.workspace = true
bytes.workspace = true
mp4box = { workspace = true, optional = true }
matroska-demuxer = { workspace = true, optional = true }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
