# rtflow-server example configuration.
# Start: rtflow-server --config rtflow.toml
# Check: rtflow-server --config rtflow.toml --check-config

[storage]
database = "./state/rtflow.db"
busy_timeout = "5s"
master_key_env = "RTFLOW_MASTER_KEY"

[server]
name = "rtflow"
shutdown_grace = "10s"
state_dir = "./state"
# Public URLs used by the discovery API. Set these when behind NAT/reverse proxy.
public_rtsp = "rtsp://127.0.0.1:8554"
public_rtmp = "rtmp://127.0.0.1:1935"
public_srt = "srt://127.0.0.1:9000"
public_http = "http://127.0.0.1:3000"

[log]
level = "info"
format = "text"          # text | json
access_log = false

[rtsp]
enabled = true
listen = "0.0.0.0:8554"
max_sessions_per_ip = 32
session_timeout = "60s"
max_sessions = 256
dynamic_publishers = true

[rtmp]
enabled = true
listen = "0.0.0.0:1935"

[srt]
enabled = true
listen = "0.0.0.0:9000"
latency_ms = 120
peer_idle_timeout = "30s"
tlpktdrop = true
mtu = 1500
max_connections = 10
# HaiCrypt encryption (10..80 byte passphrase). Leave unset for plaintext.
# passphrase = "${RTFLOW_SRT_PASSPHRASE}"
# pbkeylen = 16
enforced_encryption = true
allowed_stream_ids = []

# Pull sources (server as SRT caller). Each entry reconnects with backoff.
# [[srt.pull]]
# remote = "192.0.2.10:9000"
# stream_id = "live/camera1"
# mount = "/live/camera1"          # defaults to the Stream ID resource
# passphrase = "${RTFLOW_SRT_PASSPHRASE}"  # defaults to [srt].passphrase
# pbkeylen = 16
# latency_ms = 120

# Push destinations (server as SRT caller/sender). Mounts are muxed to
# MPEG-TS (H.264/H.265/AAC) and reconnect with backoff.
# [[srt.push]]
# mount = "/live/camera1"
# remote = "192.0.2.20:9000"
# stream_id = "live/camera1"       # defaults to the mount path without "/"
# passphrase = "${RTFLOW_SRT_PASSPHRASE}"
# pbkeylen = 16
# latency_ms = 120  # empty = open; list exact stream ids to restrict
# Publish tokens/keys are verified from `streamid` (`live/cam?token=...`)
# using the [auth] configuration, like RTSP/RTMP/HTTP.

[webrtc]
enabled = true

[http]
listen = "0.0.0.0:3000"
# HTTPS: set both files (RTSP TLS is configured under [rtsp.tls]).
# tls.certificate = "/etc/rtflow/server.crt"
# tls.private_key = "/etc/rtflow/server.key"
admin = true
metrics = true
health = true
admin_username = "admin"
# Prefer RTFLOW_ADMIN_PASSWORD in production; empty disables the console.
admin_password = ""
# Static bearer tokens for the control API (`Authorization: Bearer ...`).
# api_tokens = ["${RTFLOW_API_TOKEN}"]

[hls]
enabled = true
segment_duration = "1s"
window = 7
low_latency = true

[dash]
enabled = true
# 可选：缺省继承 [hls] 的分片时长/窗口。
# segment_duration = "1s"
# window = 5
# min_buffer_time = "2s"
# time_shift_buffer_depth = "5s"
# suggested_presentation_delay = "3s"

[flv]
enabled = true
ws_listen = "0.0.0.0:8088"

[recording]
enabled = true
root = "./recordings"
segment_duration = "10s"
retention = "7d"
max_disk_bytes = 53687091200
auto_start = true

[auth]
# none | basic | digest | token
mode = "none"
realm = "rtflow"
enforce_path_rules = true
# token_secrets = ["${RTFLOW_TOKEN_SECRET}"]

# [[auth.users]]
# username = "publisher"
# password = "$argon2id$v=19$m=19456,t=2,p=1$..."
# roles = ["publish", "read"]

[keys]
default_ttl = "24h"
max_per_path = 10

[hooks]
# timeout = "2s"
# fail_closed = true
# secret = "${RTFLOW_HOOK_SECRET}"
# on_publish_auth = "https://api.example.com/rtflow/publish"
# on_play_auth = "https://api.example.com/rtflow/play"
# on_publish_done = "https://api.example.com/rtflow/publish-done"
# on_play_done = "https://api.example.com/rtflow/play-done"
# on_record_done = "https://api.example.com/rtflow/record-done"

[discovery]
public = false
# token = "${RTFLOW_DISCOVERY_TOKEN}"
compat_mediamtx = false

[paths."live/*"]
enabled = true
publish = true
read = true
record = true
hls = true
dash = true
flv = true
webrtc = true
max_readers = 100

[paths."private/**"]
enabled = true
publish = true
read = false
record = true
hls = false
dash = false
flv = false
webrtc = false
