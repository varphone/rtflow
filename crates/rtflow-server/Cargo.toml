[package]
name = "rtflow-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Out-of-the-box RTSP/RTMP/SRT/WebRTC/HLS/DASH streaming server with recording, VOD and a control plane"
readme = "README.md"
default-run = "rtflow-server"
publish = false

[[bin]]
name = "rtflow-server"
path = "src/main.rs"

[dependencies]
rtflow = { workspace = true, features = [
    "full",
    "admin",
    "experimental-protocols",
    "srtp",
    "multicast",
    "logging",
] }
base64.workspace = true
clap.workspace = true
getrandom.workspace = true
hmac.workspace = true
futures.workspace = true
humantime-serde.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
broadcast-common.workspace = true
transmux.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
url.workspace = true
argon2.workspace = true
zeroize.workspace = true

[dev-dependencies]
rcgen.workspace = true
rtflow-testkit.workspace = true
tempfile = "3"
