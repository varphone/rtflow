[package]
name = "rtflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Async RTSP/RTP client, server and on-demand proxy framework for embedded media"
documentation = "https://docs.rs/rtflow"
readme = "../../README.md"
categories = ["network-programming", "asynchronous", "multimedia"]
keywords = ["rtsp", "rtp", "streaming", "media", "embedded"]
publish = ["crates-io"]
autobins = false
autoexamples = false

[package.metadata.docs.rs]
features = ["rtmp", "srt", "dash", "webrtc", "srtp", "tls"]

# The umbrella crate. Feature names are the public contract; each one turns on
# the crate that implements it. See docs/architecture/crates.md.
[features]
default = ["full"]
full = [
    "tls", "mp4", "mkv", "client", "server", "file-storage",
    "metrics", "http", "http-flv", "hls", "ws-flv", "logging",
]
embedded-gateway = ["client", "server", "tls", "metrics", "http", "http-flv", "hls", "ws-flv"]
experimental-protocols = ["dash", "rtmp", "srt", "webrtc"]

tls = [
    "rtflow-security/tls",
    "rtflow-rtsp-client/tls",
    "rtflow-rtsp-server/tls",
    "rtflow-mount/tls",
    "rtflow-http/tls",
]
mp4 = ["rtflow-file/mp4"]
mkv = ["rtflow-file/mkv"]
client = ["dep:rtflow-rtsp-client"]
server = ["dep:rtflow-rtsp-server"]
file-storage = ["dep:rtflow-file", "dep:rtflow-storage"]
metrics = [
    "dep:rtflow-metrics",
    "rtflow-mount/metrics",
    "rtflow-http/metrics",
    "rtflow-http-flv/metrics",
    "rtflow-hls/metrics",
    "rtflow-dash/metrics",
    "rtflow-rtmp/metrics",
    "rtflow-srt/metrics",
    "rtflow-webrtc/metrics",
    "rtflow-rtsp-server/metrics",
]
http = ["dep:rtflow-http"]
http-flv = ["http", "dep:rtflow-http-flv"]
ws-flv = ["http-flv", "rtflow-http-flv/ws"]
hls = ["http", "mp4", "dep:rtflow-hls"]
dash = ["hls", "dep:rtflow-dash"]
rtmp = ["dep:rtflow-rtmp"]
srt = ["dep:rtflow-srt"]
onvif = ["dep:rtflow-onvif"]
# Low-level RTSP/interleaved framer (exposed for fuzzing and tooling).
framing = ["dep:rtflow-framing"]
webrtc = ["http", "dep:rtflow-webrtc"]
srtp = ["dep:rtflow-srtp", "rtflow-rtsp/srtp", "rtflow-rtsp-client/srtp", "rtflow-rtsp-server/srtp"]
multicast = [
    "rtflow-media/multicast",
    "rtflow-rtsp/multicast",
    "rtflow-rtsp-client/multicast",
    "rtflow-rtsp-server/multicast",
    "rtflow-mount/multicast",
    "rtflow-hls/multicast",
]
test-source = ["dep:rtflow-source"]
gstreamer = ["dep:rtflow-gst"]
admin = ["http", "server", "hls", "dep:rtflow-admin"]
# Optional logging initializer (`rtflow::logging`). Applications that install
# their own tracing subscriber can leave it off.
logging = ["dep:tracing-subscriber"]

[[example]]
name = "authenticated_server"
path = "examples/server/authenticated_server.rs"
[[example]]
name = "file_server"
path = "examples/server/file_server.rs"
[[example]]
name = "hls_server"
path = "examples/server/hls_server.rs"
[[example]]
name = "http_flv_server"
path = "examples/server/http_flv_server.rs"
[[example]]
name = "live_stream_demo"
path = "examples/server/live_stream_demo.rs"
[[example]]
name = "local_source"
path = "examples/server/local_source.rs"
required-features = ["test-source", "server"]
[[example]]
name = "pipeline_server"
path = "examples/server/pipeline_server.rs"
[[example]]
name = "proxy_server"
path = "examples/server/proxy_server.rs"
[[example]]
name = "publisher_server"
path = "examples/server/publisher_server.rs"
[[example]]
name = "recording_vod_server"
path = "examples/server/recording_vod_server.rs"
[[example]]
name = "mem_probe"
path = "examples/client/mem_probe.rs"
[[example]]
name = "play_client"
path = "examples/client/play_client.rs"
[[example]]
name = "dash_server"
path = "examples/protocols/dash_server.rs"
required-features = ["dash", "server"]
[[example]]
name = "gstreamer_live_play"
path = "examples/protocols/gstreamer_live_play.rs"
[[example]]
name = "rtmp_server"
path = "examples/protocols/rtmp_server.rs"
required-features = ["rtmp", "server"]
[[example]]
name = "srt_server"
path = "examples/protocols/srt_server.rs"
required-features = ["srt", "server"]
[[example]]
name = "webrtc_server"
path = "examples/protocols/webrtc_server.rs"
required-features = ["webrtc", "http", "server"]
[[example]]
name = "live_vod_gateway"
path = "examples/gateway/live_vod_gateway.rs"
required-features = ["server", "rtmp", "hls", "admin", "file-storage", "mp4", "mkv"]
[[example]]
name = "multi_protocol_gateway"
path = "examples/gateway/multi_protocol_gateway.rs"
required-features = ["rtmp", "srt", "dash", "webrtc", "server", "hls", "http-flv"]
[[example]]
name = "ffmpeg_live_publish"
path = "examples/embedded/ffmpeg_live_publish.rs"
[[example]]
name = "ipc_camera"
path = "examples/embedded/ipc_camera.rs"
[[bench]]
name = "hot_path"
harness = false
[[bench]]
name = "throughput"
harness = false
required-features = ["srtp"]

[dependencies]
rtflow-core.workspace = true
rtflow-media.workspace = true
rtflow-rtp.workspace = true
rtflow-rtcp.workspace = true
rtflow-rtsp.workspace = true
rtflow-security.workspace = true
rtflow-multicast.workspace = true
rtflow-runtime.workspace = true
rtflow-framing = { workspace = true, optional = true }
rtflow-mount.workspace = true
rtflow-pipeline.workspace = true
rtflow-gateway.workspace = true
rtflow-srtp = { workspace = true, optional = true }
rtflow-rtsp-client = { workspace = true, optional = true }
rtflow-rtsp-server = { workspace = true, optional = true }
rtflow-http = { workspace = true, optional = true }
rtflow-file = { workspace = true, optional = true }
rtflow-storage = { workspace = true, optional = true }
rtflow-hls = { workspace = true, optional = true }
rtflow-dash = { workspace = true, optional = true }
rtflow-http-flv = { workspace = true, optional = true }
rtflow-rtmp = { workspace = true, optional = true }
rtflow-srt = { workspace = true, optional = true }
rtflow-webrtc = { workspace = true, optional = true }
rtflow-metrics = { workspace = true, optional = true }
rtflow-admin = { workspace = true, optional = true }
rtflow-source = { workspace = true, optional = true }
rtflow-onvif = { workspace = true, optional = true }
rtflow-gst = { workspace = true, optional = true }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
base64.workspace = true
async-trait.workspace = true
rtc.workspace = true
webrtc.workspace = true
tracing.workspace = true
bytes.workspace = true
clap.workspace = true
futures.workspace = true
criterion.workspace = true
rcgen.workspace = true
serde_json.workspace = true
sha1.workspace = true
rtflow-testkit.workspace = true
socket2.workspace = true
tokio-rustls.workspace = true
tracing-log.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[[example]]
name = "whep_probe"
path = "examples/whep_probe.rs"
required-features = ["webrtc"]
