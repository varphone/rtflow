[package]
name = "rtflow-rtsp-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "RTSP server with publishing, playback, proxying and VOD sessions for rtflow"
readme = false
publish = true

[features]
default = []
tls = [
    "rtflow-security/tls",
    "rtflow-rtsp-client/tls",
    "rtflow-mount/tls",
    "dep:tokio-rustls",
]
srtp = [
    "rtflow-rtsp-client/srtp",
    "rtflow-rtsp/srtp",
    "dep:rtflow-srtp",
]
multicast = [
    "rtflow-media/multicast",
    "rtflow-rtsp/multicast",
    "rtflow-rtsp-client/multicast",
    "rtflow-mount/multicast",
]
file-storage = ["dep:rtflow-storage"]
metrics = []

[dependencies]
rtflow-core.workspace = true
rtflow-media.workspace = true
rtflow-rtp.workspace = true
rtflow-rtcp.workspace = true
rtflow-rtsp.workspace = true
rtflow-rtsp-client.workspace = true
rtflow-mount.workspace = true
rtflow-security.workspace = true
rtflow-runtime.workspace = true
rtflow-framing.workspace = true
tokio-rustls = { workspace = true, optional = true }
rtflow-storage = { workspace = true, optional = true }
bytes.workspace = true
getrandom.workspace = true
rtflow-srtp = { workspace = true, optional = true }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
