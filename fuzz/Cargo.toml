[package]
name = "rtsp-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1.10"
libfuzzer-sys = "0.4"
rtflow = { path = "..", features = ["multicast", "srtp"] }

[workspace]
members = ["."]

[[bin]]
name = "control_framing"
path = "fuzz_targets/control_framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rtp_rtcp"
path = "fuzz_targets/rtp_rtcp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sdp"
path = "fuzz_targets/sdp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transport"
path = "fuzz_targets/transport.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rtsp_message"
path = "fuzz_targets/rtsp_message.rs"
test = false
doc = false
bench = false
