[package]
name = "rtflow"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
autobins = false
description = "Async RTSP/RTP client, server and on-demand proxy framework for embedded media"
documentation = "https://docs.rs/rtflow"
readme = "README.md"
publish = ["crates-io"]

[[bench]]
name = "hot_path"
harness = false

[dependencies]
base64 = "0.23"
bytes = "1.10"
futures = "0.3"
md-5 = "0.11"
sha2 = "0.11"
subtle = "2.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
matroska-demuxer = "0.8"
mp4box = { version = "0.12", default-features = false }
thiserror = "2"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util", "process", "signal", "fs"] }
tracing = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
url = "2.5"

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rcgen = "0.14"
