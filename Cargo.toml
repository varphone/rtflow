[workspace]
members = ["support"]

[package]
name = "rtflow"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
autobins = false
autoexamples = false
description = "Async RTSP/RTP client, server and on-demand proxy framework for embedded media"
documentation = "https://docs.rs/rtflow"
readme = "README.md"
license = "MIT OR Apache-2.0"
categories = ["network-programming", "asynchronous", "multimedia"]
keywords = ["rtsp", "rtp", "streaming", "media", "embedded"]
publish = ["crates-io"]
# dev-only tooling stays out of the published tarball.
exclude = ["support", "fuzz", "scripts", ".github", "docs/archive"]

[package.metadata.docs.rs]
# docs.rs 默认只开 default features；这里叠加实验协议，但排除 gstreamer
# （需要系统 GStreamer 开发库，docs.rs 构建机不提供）。
features = ["rtmp", "srt", "dash", "webrtc"]

[features]
default = ["full"]
full = [
    "srtp", "tls", "mp4", "mkv", "client", "server", "file-storage",
    "metrics", "multicast", "http", "http-flv", "hls", "ws-flv",
]
embedded-gateway = ["client", "server", "tls", "metrics", "http", "http-flv", "hls", "ws-flv"]
experimental-protocols = ["dash", "rtmp", "srt", "webrtc"]
srtp = ["dep:aes", "dep:cipher", "dep:sha1"]
tls = ["dep:rustls", "dep:rustls-pemfile", "dep:tokio-rustls"]
mp4 = ["dep:mp4box"]
mkv = ["dep:matroska-demuxer"]
client = []
server = ["client", "file-storage"]
file-storage = []
metrics = []
multicast = []
test-source = []
gstreamer = ["dep:gstreamer", "dep:gstreamer-app"]
http = ["dep:http-crate"]
http-flv = ["http"]
ws-flv = ["http-flv", "dep:sha1"]
hls = ["http", "mp4"]
dash = ["hls"]
rtmp = []
srt = []
webrtc = ["http", "dep:webrtc", "dep:rtc", "dep:async-trait"]

# Examples are grouped by area; autodiscovery is disabled.
[[example]]
name = "authenticated_server"
path = "examples/server/authenticated_server.rs"

[[example]]
name = "file_server"
path = "examples/server/file_server.rs"

[[example]]
name = "hls_server"
path = "examples/server/hls_server.rs"

[[example]]
name = "http_flv_server"
path = "examples/server/http_flv_server.rs"

[[example]]
name = "live_stream_demo"
path = "examples/server/live_stream_demo.rs"

[[example]]
name = "local_source"
path = "examples/server/local_source.rs"
required-features = ["test-source", "server"]

[[example]]
name = "pipeline_server"
path = "examples/server/pipeline_server.rs"

[[example]]
name = "proxy_server"
path = "examples/server/proxy_server.rs"

[[example]]
name = "publisher_server"
path = "examples/server/publisher_server.rs"

[[example]]
name = "recording_vod_server"
path = "examples/server/recording_vod_server.rs"

[[example]]
name = "mem_probe"
path = "examples/client/mem_probe.rs"

[[example]]
name = "play_client"
path = "examples/client/play_client.rs"

[[example]]
name = "dash_server"
path = "examples/protocols/dash_server.rs"
required-features = ["dash", "server"]

[[example]]
name = "gstreamer_live_play"
path = "examples/protocols/gstreamer_live_play.rs"

[[example]]
name = "rtmp_server"
path = "examples/protocols/rtmp_server.rs"
required-features = ["rtmp", "server"]

[[example]]
name = "srt_server"
path = "examples/protocols/srt_server.rs"
required-features = ["srt", "server"]

[[example]]
name = "webrtc_server"
path = "examples/protocols/webrtc_server.rs"
required-features = ["webrtc", "http", "server"]

[[example]]
name = "multi_protocol_gateway"
path = "examples/gateway/multi_protocol_gateway.rs"
required-features = ["rtmp", "srt", "dash", "webrtc", "server", "hls", "http-flv"]

[[example]]
name = "ffmpeg_live_publish"
path = "examples/embedded/ffmpeg_live_publish.rs"

[[example]]
name = "ipc_camera"
path = "examples/embedded/ipc_camera.rs"

[[bench]]
name = "hot_path"
harness = false

[[bench]]
name = "throughput"
harness = false

[dependencies]
aes = { version = "0.9", optional = true }
base64 = "0.23"
bytes = "1.10"
cipher = { version = "0.5", optional = true }
futures = "0.3"
getrandom = "0.2"
hmac = "0.13"
md-5 = "0.11"
sha1 = { version = "0.11", optional = true }  # srtp + ws-flv（RFC 6455 握手）
sha2 = "0.11"
socket2 = "0.6"
subtle = "2.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pemfile = { version = "2.2", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
matroska-demuxer = { version = "0.8", optional = true }
mp4box = { version = "0.12", default-features = false, optional = true }
thiserror = "2"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util", "process", "signal", "fs"] }
tracing = { version = "0.1", features = ["release_max_level_info"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2.5"
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
http-crate = { package = "http", version = "1", optional = true }
webrtc = { version = "0.20", optional = true }
rtc = { version = "0.20", optional = true }
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }
rtflow-testkit = { path = "support" }
criterion = { version = "0.8", features = ["html_reports"] }
tokio = { version = "1.43", features = ["test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
rcgen = "0.14"
socket2 = "0.6"
base64 = "0.23"

# ---------------------------------------------------------------------------
# Embedded IPC release profile (see docs/audits/embedded-resource.md §3 P0-1):
# - fat LTO + codegen-units=1: smaller & slightly faster binary
# - panic=abort: no unwinding tables (saves ROM/RAM)
# - strip=symbols: drop symbol table from the shipped artifact
# - opt-level="s": size-oriented codegen; switch to 3 if CPU-bound
#   (RTP hot path) proves slower than 5% on the target.
# Tests always use the dev profile, so panic=abort never affects them.
# ---------------------------------------------------------------------------
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "s"
