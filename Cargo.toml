[package]
name = "rtsp"
version = "0.1.0"
edition = "2024"
autobins = false
description = "Async RTSP/RTP client, server and on-demand proxy framework for embedded media"
publish = ["crates-io"]

[dependencies]
base64 = "0.23"
bytes = "1.10"
futures = "0.3"
md-5 = "0.11"
matroska-demuxer = "0.8"
mp4box = { version = "0.12", default-features = false }
thiserror = "2"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util", "process"] }
tracing = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
url = "2.5"
