[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/varphone/rtflow"

[workspace.dependencies]
# Internal crates (path + version so `cargo publish` rewrites them correctly).
rtflow-core = { path = "crates/rtflow-core", version = "0.3.0" }
rtflow-media = { path = "crates/rtflow-media", version = "0.3.0" }
rtflow-rtp = { path = "crates/rtflow-rtp", version = "0.3.0" }
rtflow-rtcp = { path = "crates/rtflow-rtcp", version = "0.3.0" }
rtflow-srtp = { path = "crates/rtflow-srtp", version = "0.3.0" }
rtflow-rtsp = { path = "crates/rtflow-rtsp", version = "0.3.0" }
rtflow-security = { path = "crates/rtflow-security", version = "0.3.0" }
rtflow-multicast = { path = "crates/rtflow-multicast", version = "0.3.0" }
rtflow-runtime = { path = "crates/rtflow-runtime", version = "0.3.0" }
rtflow-framing = { path = "crates/rtflow-framing", version = "0.3.0" }
rtflow-mount = { path = "crates/rtflow-mount", version = "0.3.0" }
rtflow-pipeline = { path = "crates/rtflow-pipeline", version = "0.3.0" }
rtflow-http = { path = "crates/rtflow-http", version = "0.3.0" }
rtflow-file = { path = "crates/rtflow-file", version = "0.3.0" }
rtflow-storage = { path = "crates/rtflow-storage", version = "0.3.0" }
rtflow-rtsp-client = { path = "crates/rtflow-rtsp-client", version = "0.3.0" }
rtflow-rtsp-server = { path = "crates/rtflow-rtsp-server", version = "0.3.0" }
rtflow-hls = { path = "crates/rtflow-hls", version = "0.3.0" }
rtflow-dash = { path = "crates/rtflow-dash", version = "0.3.0" }
rtflow-http-flv = { path = "crates/rtflow-http-flv", version = "0.3.0" }
rtflow-rtmp = { path = "crates/rtflow-rtmp", version = "0.3.0" }
rtflow-srt = { path = "crates/rtflow-srt", version = "0.3.0" }
rtflow-webrtc = { path = "crates/rtflow-webrtc", version = "0.3.0" }
rtflow-gst = { path = "crates/rtflow-gst", version = "0.3.0" }
rtflow-gateway = { path = "crates/rtflow-gateway", version = "0.3.0" }
rtflow-admin = { path = "crates/rtflow-admin", version = "0.3.0" }
rtflow-metrics = { path = "crates/rtflow-metrics", version = "0.3.0" }
rtflow-source = { path = "crates/rtflow-source", version = "0.3.0" }
rtflow-onvif = { path = "crates/rtflow-onvif", version = "0.3.0" }
rtflow = { path = "crates/rtflow", version = "0.3.0" }
rtflow-testkit = { path = "crates/rtflow-testkit" }

# Third-party
aes = { version = "0.9" }
aes-gcm = "0.10"
async-trait = { version = "0.1" }
base64 = "0.23"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
cipher = { version = "0.5" }
criterion = { version = "0.8", features = ["html_reports"] }
futures = "0.3"
getrandom = "0.2"
gstreamer = { version = "0.25" }
gstreamer-app = { version = "0.25" }
hmac = "0.13"
matroska-demuxer = { version = "0.8" }
md-5 = "0.11"
mp4box = { version = "0.12", default-features = false }
quick-xml = "0.30"
nix = { version = "0.31", features = ["socket", "net", "uio"] }
rcgen = "0.14"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rtc = { version = "0.20" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = { version = "2.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.11" }
sha2 = "0.11"
socket2 = "0.6"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util", "process", "signal", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { version = "0.1", features = ["release_max_level_info"] }
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
broadcast-common = { version = "12", default-features = false, features = ["std"] }
transmux = { version = "0.31", default-features = false, features = ["std"] }
url = "2.5"
webrtc = { version = "0.21" }
argon2 = { version = "0.5" }
clap = { version = "4.5", features = ["derive"] }
humantime-serde = "1"
toml = "0.9"
zeroize = "1"

# ---------------------------------------------------------------------------
# Embedded IPC release profile (see docs/audits/embedded-resource.md §3 P0-1):
# - fat LTO + codegen-units=1: smaller & slightly faster binary
# - panic=abort: no unwinding tables (saves ROM/RAM)
# - strip=symbols: drop symbol table from the shipped artifact
# - opt-level="s": size-oriented codegen; switch to 3 if CPU-bound
#   (RTP hot path) proves slower than 5% on the target.
# Tests always use the dev profile, so panic=abort never affects them.
# ---------------------------------------------------------------------------
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "s"
